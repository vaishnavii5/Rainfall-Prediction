<!DOCTYPE html>
<html>
<head>
    <title>Rainfall Prediction and Flood Alert</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Rainfall Prediction and Flood Alert</h1>
        <form action="/predict" method="post">
            <label for="region">Select Region:</label>
            <select name="region" id="region" required>
                {% for region in regions %}
                    <option value="{{ region }}" {% if region == selected_region %}selected{% endif %}>{{ region }}</option>
                {% endfor %}
            </select>

            <label for="month">Select Month:</label>
            <select name="month" id="month" required>
                {% for month in months %}
                    <option value="{{ month }}" {% if month == selected_month %}selected{% endif %}>{{ month }}</option>
                {% endfor %}
            </select>

            <label for="year">Enter Year:</label>
            <input type="number" name="year" id="year" min="1901" max="2100" required value="{{ selected_year if selected_year else '' }}">

            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
            <div class="result">
                <h2>Predicted Rainfall: {{ prediction }} mm</h2>
                {% if flood_alert %}
                    <h3 class="alert">⚠️ Flood Risk Alert!</h3>
                    <audio autoplay>
                        <source src="{{ url_for('static', filename='audio/flood_alert.mp3') }}" type="audio/mpeg">
                    </audio>
                {% else %}
                    <h3 class="safe">✅ No Flood Risk</h3>
                {% endif %}

                {% if map_filename %}
                    <h3>Region Map: {{ selected_region }}</h3>
                    <img src="{{ url_for('static', filename='img/maps/' + map_filename) }}" alt="{{ selected_region }} map">
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
